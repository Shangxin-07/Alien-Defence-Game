<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alien Defence Base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap" />
  </head>
  <body class="base">
    <canvas id="stage" aria-label="Base layout, one level at a time"></canvas>
    <div id="labels" aria-hidden="true"></div>

    <aside class="side">
      <section class="hud head">
        <div class="title">
          <h1>Base Alpha</h1>
          <a class="nav" id="nav" href="./index.html">Geoscape</a>
        </div>
        <div class="row"><span>Funds</span><span id="funds">—</span></div>
        <div class="row"><span>Day</span><span id="day">—</span></div>
        <div class="wait">
          <button id="wait1" type="button">+1 day</button>
          <button id="waitNext" type="button">Next done</button>
        </div>
      </section>
      <section class="hud palette" aria-label="Build">
        <div class="tools">
          <button id="inspect" type="button" aria-pressed="true" title="Inspect (Esc)">Inspect</button>
          <button id="rotate" type="button" title="Rotate room (R)">Rotate</button>
          <button id="demolish" type="button" aria-pressed="false" title="Demolish (X)">Demolish</button>
        </div>
        <ul id="palette"></ul>
      </section>
    </aside>

    <section class="hud tr levels" aria-label="Levels">
      <div id="levels"></div>
    </section>

    <section class="hud br stats" aria-label="Base status">
      <details id="statsBox" open>
        <summary>Base status</summary>
        <div id="stats"></div>
        <button id="reset" type="button" class="reset">New base</button>
      </details>
    </section>

    <div class="hud info" id="info" aria-live="polite"></div>
    <div id="toast" role="status"></div>

    <script type="module" src="/src/base.ts"></script>
  </body>
</html>
